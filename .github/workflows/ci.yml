name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metas:
    name: Meta files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Unity ignores files without a .meta in packages installed from git.
      - run: |
          missing=0
          while IFS= read -r path; do
            case "$path" in
              *.meta) [ -e "${path%.meta}" ] || { echo "::error file=$path::No asset for $path"; missing=1; } ;;
              *) [ -e "$path.meta" ] || { echo "::error file=$path::$path has no .meta"; missing=1; } ;;
            esac
          done < <(find . -mindepth 1 \( -name '.*' -o -name '*~' \) -prune -o -print)
          exit $missing

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: TestProject~/Library
          key: library-${{ hashFiles('package.json', 'TestProject~/Packages/manifest.json', 'TestProject~/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: library-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: TestProject~
          testMode: editmode
          coverageEnabled: false
